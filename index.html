<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Φυσική Γ' Γυμνασίου — Σημειώσεις &amp; Ασκήσεις</title>
<style>
  :root{
    --paper:#f3f4f8; --ink:#1a2138; --ink-soft:#4b5370; --line:rgba(26,33,56,.14);
    --accent:#c9860a; --panel:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#10131f; --ink:#e9ebf3; --ink-soft:#b7bcd4; --line:rgba(233,235,243,.14);
      --accent:#ffb703; --panel:#171b2c; }
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    padding:48px 20px 80px;}
  .wrap{max-width:640px; margin:0 auto;}
  h1{font-size:1.7rem; margin:0 0 6px;}
  p.lede{color:var(--ink-soft); margin:0 0 32px;}
  ul{list-style:none; margin:0; padding:0; display:grid; gap:12px;}
  li a{
    display:block; padding:16px 18px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; color:var(--ink); text-decoration:none; font-weight:600;
    border-left:4px solid var(--accent);
  }
  li a:hover{border-color:var(--accent);}
  li span{display:block; font-weight:400; font-size:.85em; color:var(--ink-soft); margin-top:3px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Φυσική Γ' Γυμνασίου</h1>
  <p class="lede">Σημειώσεις και ασκήσεις, κεφάλαιο-κεφάλαιο.</p>
  <ul>
    <li><a href="kefalaio-0/">Κεφάλαιο 0 — Έργο, Ενέργεια και Ισχύς
      <span>Προαπαιτούμενο (από τη Β' Γυμνασίου)</span></a></li>
    <li><a href="kefalaio-1/">Κεφάλαιο 1 — Ηλεκτρική Δύναμη και Φορτίο
      <span>Ενότητα 1: Ηλεκτρισμός</span></a></li>
  </ul>
</div>
</body>
</html>
